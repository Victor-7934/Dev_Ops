name: CI devops 2025

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Initialisation du Java Development Kit (JDK) version 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Lancement des tests. Maven va utiliser Testcontainers pour lever un conteneur PostgreSQL temporaire
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml # <-- Corrigé ici (pom.xml)