#test
name: CI devops 2025

on:
  push:
    branches:
      - main        
      - develop
  pull_request:

jobs:

  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Étape unique : compile, teste et envoie directement les résultats à SonarCloud
      - name: Build, test and SonarCloud analysis
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=Victor-7934_Dev_Ops \
            -Dsonar.organization=victor-7934 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            --file ./TP1_docker/backend2/simpleapi/pom.xml

build-and-push-backend:
  needs: test-backend
  runs-on: ubuntu-24.04
  steps:
    - uses: actions/checkout@v4
    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
    - name: Build and push backend
      uses: docker/build-push-action@v6
      with:
        context: ./TP1_docker/backend2/simpleapi
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
        push: ${{ github.ref == 'refs/heads/main' }}

build-and-push-database:
  needs: test-backend
  runs-on: ubuntu-24.04
  steps:
    - uses: actions/checkout@v4
    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
    - name: Build and push database
      uses: docker/build-push-action@v6
      with:
        context: ./TP1_docker/sql
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
        push: ${{ github.ref == 'refs/heads/main' }}

build-and-push-httpd:
  needs: test-backend
  runs-on: ubuntu-24.04
  steps:
    - uses: actions/checkout@v4
    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
    - name: Build and push httpd
      uses: docker/build-push-action@v6
      with:
        context: ./TP1_docker/http
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
        push: ${{ github.ref == 'refs/heads/main' }}