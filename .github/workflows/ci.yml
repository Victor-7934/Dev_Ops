name: CI
 
on:
  push:
    branches:
      - main
      - develop
  pull_request:
 
jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Clean and version
        run: |
          mvn -B clean \
            --file ./TP1_docker/backend2/simpleapi/pom.xml

      - name: Build, test and SonarCloud analysis
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=Victor-7934_Dev_Ops \
            -Dsonar.organization=victor-7934\
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            --file ./TP1_docker/backend2/simpleapi/pom.xml